# =============================================
# Helm Template — Ingress Manifest
# =============================================

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dap-{{ .Chart.Name }}.ingress.name" . }}
  annotations: {{- include "dap-{{ .Chart.Name }}.ingress.annotations" . | nindent 6 }}
spec:
  ingressClassName: {{ .Values.ingress.class | default "nginx" }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dap-{{ .Chart.Name }}.service.name" . }}
                port:
                  number: {{ .Values.service.ports[0].port | default 80 }}
    {{- end }}
{{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts: {{ .host | list }}
      secretName: {{ .secret | quote }}
    {{- end }}
{{- endif }}
{{- end }}
