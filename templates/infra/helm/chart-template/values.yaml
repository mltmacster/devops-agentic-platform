# =============================================
# Helm Values — DAP Microservice Template
# =============================================

# General settings
replicaCount: 2
imagePullSecrets: []
namespace: "dap"

# Service configuration
serviceAccountName: ""
automountServiceAccountToken: false

# ─── Deployment ──────────────────────────────
deployment:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# ─── Service & Ingress ───────────────────────
service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.containerPorts.http }}

ingress:
  enabled: false
  class: nginx
  annotations: {}
  hosts: []
  tls: []

# ─── Container ────────────────────────────────
containerPorts:
  http: 8000

image:
  repository: ghcr.io/dap/{{ .Chart.Name }}
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "100m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "128Mi"

# ─── Liveness / Readiness Probes ─────────────
livenessProbe:
  httpGet:
    path: /health/live
    port: {{ .Values.containerPorts.http }}
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: {{ .Values.containerPorts.http }}
  initialDelaySeconds: 10
  periodSeconds: 5

# ─── Environment Variables ────────────────────
env: []
envFrom:
  - secretRef:
      name: {{ .Values Secrets.secretName | default "dap-secret" }}
