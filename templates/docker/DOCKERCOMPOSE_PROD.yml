# =============================================
# DAP Production Stack — docker compose
# =============================================
# Services: postgres (identity + workspace + sandbox state)
#           api       (FastAPI monolith, src.main:app, strict auth)
#           dashboard (live browser dashboard, polls the API)
#           caddy     (reverse proxy, automatic Let's Encrypt TLS)
#
# Usage (from the repo root's templates/docker directory):
#   cp ../../.env.template .env   # then fill in DAP_JWT_SECRET, DAP_PUBLIC_HOST, ...
#   docker compose -f DOCKERCOMPOSE_PROD.yml up -d --build
#
# Set DAP_PUBLIC_HOST to your domain (Caddy provisions TLS automatically
# for HTTP-01 challenge; the domain must A-record to this host).
#
# Exposure: Caddy (80/443) is the ONLY public entry point. The api and
# dashboard ports are NOT published to the host (SOLUTION 38) — the browser
# reaches the dashboard on / and the API on /api/* through Caddy.

name: dap

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dap}
      POSTGRES_USER: ${POSTGRES_USER:-dap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 5432 is intentionally NOT published: only the api container talks to
    # postgres, over the compose network. Publish it temporarily only for
    # psql debugging.

  api:
    build:
      # Repo root (compose is run from templates/docker/ — see header & guide)
      context: ../..
      dockerfile: templates/docker/Dockerfile
    restart: unless-stopped
    environment:
      TESTING: "0"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dap}
      DAP_AUTH_STRICT: "1"
      DAP_JWT_SECRET: ${DAP_JWT_SECRET:?set DAP_JWT_SECRET in .env}
      DAP_LLM_API_KEY: ${DAP_LLM_API_KEY:-}
      DAP_LLM_BASE_URL: ${DAP_LLM_BASE_URL:-https://api.openai.com/v1}
      DAP_LLM_MODEL: ${DAP_LLM_MODEL:-gpt-4o-mini}
      DAP_SANDBOX_RUNTIME: ${DAP_SANDBOX_RUNTIME:-auto}
    depends_on:
      postgres:
        condition: service_healthy
    # 8001 is intentionally NOT published (SOLUTION 38): Caddy is the sole
    # public entry point. Debug with `docker compose logs api`, or add
    # "8001:8001" under `ports:` temporarily.
    #
    # ── Real sandbox execution (OPTIONAL — see docs/DEPLOYMENT_GUIDE.md,
    #    "Real sandbox execution in production") ─────────────────────────
    # Inside the container `auto` resolves to the null (no-op) backend:
    # sandbox records + state machine work, but no real container runs.
    # To drive REAL podman containers on the host from inside this
    # container, rebuild the image with a podman remote client, then:
    #   volumes:
    #     - /run/user/1000/podman/podman.sock:/run/podman/podman.sock:ro
    #   environment additions:
    #     DAP_SANDBOX_RUNTIME: "podman"
    #     PODMAN_CONNECTION: "sock"
    # (1000 = the host user that runs podman; must match.)

  dashboard:
    build:
      # Repo root (compose is run from templates/docker/ — see header & guide)
      context: ../..
      dockerfile: templates/docker/Dockerfile
    restart: unless-stopped
    command: ["python", "dap_dashboard.py", "--port", "8081"]
    environment:
      # Server-side (dashboard process → API over the compose network)
      DAP_API_URL: http://api:8001
      # Browser-side: the delivered HTML must fetch the API same-origin
      # (https://<host>/api/* via Caddy). An absolute http://api:8001 is
      # unresolvable in the user's browser and mixed-content-blocked on an
      # https page (SOLUTION 38). Empty = relative fetches.
      DAP_BROWSER_API_URL: ""
    # image healthcheck probes the API port; override for this container
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api
    # 8081 intentionally NOT published (SOLUTION 38): the dashboard is the
    # Caddy default route; the browser reaches it through Caddy only.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DAP_PUBLIC_HOST: ${DAP_PUBLIC_HOST:-dap.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dashboard

volumes:
  pgdata:
  caddy_data:
  caddy_config:
